services:
  - type: web
    name: apg-messenger
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate --schema prisma/schema.prisma && npm run build && npx prisma migrate deploy --schema prisma/schema.prisma
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: apg-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads

databases:
  - name: apg-db
    databaseName: apg
    plan: free
    region: frankfurt
